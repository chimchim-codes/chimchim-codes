<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>

    <!-- Warm accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B842"/>
      <stop offset="100%" stop-color="#F6D06D"/>
    </linearGradient>

    <!-- Card background -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FAF5ED" stop-opacity="0.7"/>
    </linearGradient>

    <style>
      .eyebrow {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2.5px;
        fill: #6E5334;
        text-transform: uppercase;
      }
      .title {
        font-family: Georgia, -apple-system, BlinkMacSystemFont, serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.5px;
        fill: #222326;
      }
      .title-accent {
        fill: #4A3525;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #5A524C;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #3E3127;
        letter-spacing: 0.4px;
      }
      .meta-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #968A7E;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="14.5" stroke="#E6DDCF" stroke-width="2"/>

  <!-- Subtle Editorial Grid Accents -->
  <g opacity="0.35" stroke="#D9CFC1" stroke-width="1" stroke-dasharray="2 4">
    <line x1="80" y1="20" x2="80" y2="320"/>
    <line x1="1120" y1="20" x2="1120" y2="320"/>
    <line x1="40" y1="56" x2="1160" y2="56"/>
    <line x1="40" y1="284" x2="1160" y2="284"/>
  </g>

  <!-- Corner Precision Marks -->
  <path d="M 72 64 L 64 64 L 64 72" stroke="#8D6E4F" stroke-width="1.5" fill="none"/>
  <path d="M 1128 64 L 1136 64 L 1136 72" stroke="#8D6E4F" stroke-width="1.5" fill="none"/>
  <path d="M 72 276 L 64 276 L 64 268" stroke="#8D6E4F" stroke-width="1.5" fill="none"/>
  <path d="M 1128 276 L 1136 276 L 1136 268" stroke="#8D6E4F" stroke-width="1.5" fill="none"/>

  <!-- Right Decorative Vector Compass / Linear Algebra Geometry -->
  <g transform="translate(970, 170)" opacity="0.85">
    <!-- Outer concentric circles -->
    <circle r="92" stroke="#E2D6C5" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <circle r="68" stroke="#D8C8B3" stroke-width="1.2" fill="none"/>
    <circle r="44" stroke="#D1BFA6" stroke-width="1" fill="#FAF5ED" fill-opacity="0.5"/>
    <circle r="6" fill="#4A3525"/>

    <!-- Subtle coordinate axes -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#C9B7A0" stroke-width="1"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#C9B7A0" stroke-width="1"/>

    <!-- Basis vector arrows in warm butter yellow & brown -->
    <line x1="0" y1="0" x2="48" y2="-48" stroke="#E5B842" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="48,-48 40,-44 44,-40" fill="#E5B842"/>

    <line x1="0" y1="0" x2="-36" y2="-54" stroke="#6E5334" stroke-width="2" stroke-linecap="round"/>
    <polygon points="-36,-54 -31,-47 -38,-47" fill="#6E5334"/>

    <!-- Small mathematical labels -->
    <text x="56" y="-50" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8D6E4F">v ∈ ℝ³</text>
    <text x="-76" y="-58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8D6E4F">∇L(θ)</text>
    <text x="82" y="14" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#B3A290" letter-spacing="1">DIM: 3</text>
  </g>

  <!-- Left Content Block -->
  <!-- Top Pill / Role Tag -->
  <g transform="translate(100, 72)">
    <rect width="365" height="28" rx="14" fill="#FBF3DE" stroke="#EBD69B" stroke-width="1"/>
    <!-- Yellow accent dot -->
    <circle cx="16" cy="14" r="5" fill="#E5B842"/>
    <text x="30" y="18.5" class="eyebrow">ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="152" class="title">
    Sharon Elsa Sam<tspan class="title-accent" font-weight="400">.</tspan>
  </text>

  <!-- Subtitle / Ambition Line -->
  <text x="102" y="188" class="tagline">
    Aspiring AI Engineer exploring how intelligent systems work and engineering reliable software.
  </text>

  <!-- Decorative Divider with Butter Yellow Accent -->
  <g transform="translate(102, 214)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#E5D9C8" stroke-width="1.5"/>
    <circle cx="28" cy="0" r="4" fill="#E5B842"/>
    <circle cx="28" cy="0" r="1.5" fill="#FAF7F2"/>
  </g>

  <!-- Domain Capability Pills -->
  <g transform="translate(102, 236)">
    <!-- Pill 1: Machine Learning -->
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="8" fill="url(#pillGrad)" stroke="#DFD5C5" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#D4A72C"/>
      <text x="26" y="20" class="pill-text">Machine Learning</text>
    </g>

    <!-- Pill 2: AI Engineering & LLMs -->
    <g transform="translate(192, 0)">
      <rect width="184" height="32" rx="8" fill="url(#pillGrad)" stroke="#DFD5C5" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#6E5334"/>
      <text x="26" y="20" class="pill-text">AI Engineering &amp; LLMs</text>
    </g>

    <!-- Pill 3: Backend Systems -->
    <g transform="translate(388, 0)">
      <rect width="168" height="32" rx="8" fill="url(#pillGrad)" stroke="#DFD5C5" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#D4A72C"/>
      <text x="26" y="20" class="pill-text">Backend Systems</text>
    </g>

    <!-- Pill 4: Data Science -->
    <g transform="translate(568, 0)">
      <rect width="144" height="32" rx="8" fill="url(#pillGrad)" stroke="#DFD5C5" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#6E5334"/>
      <text x="26" y="20" class="pill-text">Data Science</text>
    </g>
  </g>

  <!-- Bottom Right Editorial Meta Note -->
  <text x="1100" y="302" text-anchor="end" class="meta-label">CHIMCHIM-CODES // PORTFOLIO PROFILE</text>
</svg>
